server {
    listen 80;
    server_name localhost;

    # Phục vụ Single Page Application tĩnh (Tắt cache trong dev/demo để luôn thấy giao diện mới nhất)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Reverse proxy sang API Gateway trong mạng nội bộ Docker
    # Giúp Client gọi relative URL /api/... mà không lo hardcode IP máy hay lỗi CORS!
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Hỗ trợ timeout dài hơn cho các transaction xử lý concurrency
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
