services:
  # ==========================================
  # 1. CƠ SỞ DỮ LIỆU MYSQL (InnoDB Engines)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: ibanking-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    expose:
      - "3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ibanking-net

  # ==========================================
  # 2. REDIS (OTP Cache & Distributed Lock)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ibanking-redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ibanking-net

  # ==========================================
  # 3. USER & ACCOUNT SERVICE (Cổng nội bộ 8001)
  # ==========================================
  user-service:
    build:
      context: ./src/backend/services/user-service
      dockerfile: Dockerfile
    container_name: ibanking-user-service
    restart: always
    expose:
      - "8001"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ibanking_user_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ibanking-net

  # ==========================================
  # 4. TDTU TUITION SERVICE (Cổng nội bộ 8002)
  # ==========================================
  tuition-service:
    build:
      context: ./src/backend/services/tuition-service
      dockerfile: Dockerfile
    container_name: ibanking-tuition-service
    restart: always
    expose:
      - "8002"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: tdtu_tuition_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ibanking-net

  # ==========================================
  # 5. PAYMENT & SAGA SERVICE (Cổng nội bộ 8003)
  # ==========================================
  payment-service:
    build:
      context: ./src/backend/services/payment-service
      dockerfile: Dockerfile
    container_name: ibanking-payment-service
    restart: always
    expose:
      - "8003"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ibanking_payment_db
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      OTP_EXPIRE_SECONDS: ${OTP_EXPIRE_SECONDS:-300}
      USER_SERVICE_URL: http://user-service:8001
      TUITION_SERVICE_URL: http://tuition-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ibanking-net

  # ==========================================
  # 6. NOTIFICATION SERVICE (Cổng nội bộ 8004)
  # ==========================================
  notification-service:
    build:
      context: ./src/backend/services/notification-service
      dockerfile: Dockerfile
    container_name: ibanking-notification-service
    restart: always
    expose:
      - "8004"
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-iBanking TDTU Support}
      USE_TLS: ${USE_TLS:-true}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - ibanking-net

  # ==========================================
  # 7. API GATEWAY (Cổng công khai duy nhất :8000)
  # ==========================================
  api-gateway:
    build:
      context: ./src/backend/api-gateway
      dockerfile: Dockerfile
    container_name: ibanking-api-gateway
    restart: always
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      PORT: 8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      USER_SERVICE_URL: http://user-service:8001
      TUITION_SERVICE_URL: http://tuition-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    depends_on:
      - user-service
      - tuition-service
      - payment-service
    networks:
      - ibanking-net

  # ==========================================
  # 8. FRONTEND WEB APPLICATION (Cổng giao diện :3000)
  # ==========================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: ibanking-frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html
    depends_on:
      - api-gateway
    networks:
      - ibanking-net

volumes:
  mysql_data:

networks:
  ibanking-net:
    driver: bridge
